
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spiderooms Network</title>

<style>

body{

margin:0;
padding:0;

font-family:Arial,sans-serif;

background:url("Spiderooms.png");

background-size:cover;

background-position:center;

background-attachment:fixed;

overflow:hidden;

color:white;

}

/* overlay oscuro */

.overlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.45);

z-index:0;

}

/* partículas */

.particles{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

pointer-events:none;

background-image:

radial-gradient(rgba(255,255,255,0.7) 1px, transparent 1px);

background-size:70px 70px;

opacity:0.1;

animation:particlesMove 35s linear infinite;

z-index:1;

}

@keyframes particlesMove{

from{

transform:translateY(0px);

}

to{

transform:translateY(-400px);

}

}

/* niebla */

.fog{

position:fixed;

top:0;
left:0;

width:200%;
height:200%;

background:

radial-gradient(rgba(255,255,255,0.03), transparent 70%);

animation:fogMove 60s linear infinite;

pointer-events:none;

z-index:1;

}

@keyframes fogMove{

from{

transform:translate(-10%,-10%);

}

to{

transform:translate(0%,0%);

}

}

/* contenido */

.container{

position:relative;

z-index:2;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

height:100vh;

text-align:center;

padding:20px;

}

/* titulo */

.title{

font-size:85px;

letter-spacing:8px;

font-weight:normal;

text-shadow:0 0 20px rgba(255,255,255,0.35);

animation:glow 5s infinite alternate;

}

@keyframes glow{

from{

text-shadow:0 0 8px rgba(255,255,255,0.15);

}

to{

text-shadow:0 0 25px rgba(255,255,255,0.5);

}

}

/* subtitulo */

.subtitle{

font-size:24px;

opacity:0.75;

margin-top:10px;

margin-bottom:60px;

}

/* botones */

.grid{

display:grid;

grid-template-columns:repeat(2,280px);

gap:25px;

}

/* estilo botones */

button{

padding:22px;

font-size:22px;

border:none;

border-radius:18px;

background:rgba(255,255,255,0.08);

color:white;

cursor:pointer;

backdrop-filter:blur(5px);

transition:0.3s;

box-shadow:0 0 20px rgba(0,0,0,0.35);

}

button:hover{

transform:scale(1.06);

background:rgba(255,255,255,0.18);

}

/* estado */

.status{

margin-top:60px;

font-size:18px;

opacity:0.6;

line-height:1.8;

}

/* responsive */

@media(max-width:700px){

.title{

font-size:50px;

}

.grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="particles"></div>

<div class="fog"></div>

<div class="container">

<div class="title">

SPIDEROOMS NETWORK

</div>

<div class="subtitle">

Connected universes. Endless sectors. Unknown doors.

</div>

<div class="grid">

<button onclick="window.location.href='sector.html'">

🚪 SECTORS

</button>

<button onclick="window.location.href='characters.html'">

👤 CHARACTERS

</button>

<button onclick="window.location.href='seasons.html'">

📺 SEASONS

</button>

<button>

📼 TRANSMISSIONS

</button>

<button>

🌌 UNIVERSES

</button>

<button onclick="window.location.href='lore2.html'">

👁️ LORE

</button>

<button onclick="window.location.href='origin.html'">

📼 THE ORIGIN

</button>

</div>

<div class="status">
  
SECTOR STATUS: STABLE<br>
  
ACTIVE UNIVERSES: 999997<br>
  
ANOMALIES DETECTED: 0<br>

</div>

</div>

</body>

</html>
